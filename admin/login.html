<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة التحكم — بيلا بوتيك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Montserrat:wght@400;500&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12100E; --ink-2:#1B1815; --line:#2C2721;
    --gold:#C8A250; --ivory:#FBF9F5; --taupe:#8A8078; --red:#B8474F;
    --serif:"Playfair Display",Georgia,serif;
    --sans:"Tajawal","Montserrat",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100dvh; background:var(--ink); color:var(--ivory);
    font-family:var(--sans); display:grid; place-items:center; padding:1.5rem;
  }
  .door{width:100%; max-width:360px; text-align:center}

  /* the logo lockup, rebuilt in type so it stays crisp at any size */
  .mark{font-family:var(--serif); color:var(--gold); line-height:.95; letter-spacing:.01em}
  .mark .a{display:block; font-size:2.6rem}
  .mark .b{display:block; font-size:3.4rem}
  .rule{height:1px; background:var(--gold); opacity:.75; margin:1.1rem auto .9rem; width:88%}
  .sub{
    font-family:"Montserrat",sans-serif; font-size:.6rem; letter-spacing:.42em;
    color:var(--gold); text-indent:.42em; margin:0 0 2.8rem
  }

  label{display:block; font-size:.68rem; letter-spacing:.14em; color:var(--taupe); margin-bottom:.6rem}
  input{
    width:100%; padding:.85rem 1rem; background:var(--ink-2); color:var(--ivory);
    border:1px solid var(--line); border-radius:0; font-family:var(--sans);
    font-size:1rem; text-align:center; letter-spacing:.2em;
    transition:border-color .25s ease;
  }
  input:focus{outline:none; border-color:var(--gold)}
  input:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

  button{
    width:100%; margin-top:.9rem; padding:.85rem 1rem; border:0; cursor:pointer;
    background:var(--gold); color:var(--ink); font-family:var(--sans);
    font-size:.82rem; font-weight:500; letter-spacing:.12em;
    transition:opacity .25s ease;
  }
  button:hover{opacity:.88}
  button:focus-visible{outline:2px solid var(--ivory); outline-offset:2px}

  .msg{
    margin:0 0 1.1rem; padding:.7rem .9rem; font-size:.8rem; line-height:1.6;
    color:#F3D2D5; background:rgba(184,71,79,.14); border:1px solid var(--red);
  }
  .foot{margin-top:2.4rem; font-size:.66rem; color:#5A544C; letter-spacing:.06em}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
  <main class="door">
    <div class="mark"><span class="a">Bella</span><span class="b">Boutique</span></div>
    <div class="rule"></div>
    <p class="sub">AUTHENTIC LUXURY</p>

    <!--MESSAGE-->

    <form method="POST" action="/admin/login">
      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             autofocus required aria-label="كلمة المرور">
      <button type="submit">دخول</button>
    </form>

    <p class="foot">لوحة تحكم خاصة</p>
  </main>
</body>
</html>
